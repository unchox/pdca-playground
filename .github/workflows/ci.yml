name: ci   # <- must match pdca-act.yml `workflow_run.workflows`

on:
  push:
    branches: ["pdca/**"]   # the loop runs on its own task branches
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Admit gate (Phase 2, L2) — input-floor enforcement BEFORE any check runs.
  # Fail-closed: on pdca/** branches a missing/invalid intake REJECTS the run
  # and opens a human-gated issue with GITHUB_TOKEN (never PDCA_PAT — INV-2).
  # Non-pdca refs (workflow_dispatch on main etc.) skip the gate entirely.
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        if: startsWith(github.ref_name, 'pdca/')

      - uses: actions/setup-python@v5
        if: startsWith(github.ref_name, 'pdca/')
        with:
          python-version: "3.12"

      - name: Install
        if: startsWith(github.ref_name, 'pdca/')
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Admit gate (input floor)
        if: startsWith(github.ref_name, 'pdca/')
        id: admit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python .pdca/admit.py --intake .pdca/intake.json --out .pdca/ready.json; then
            echo "admit: PASS"
          else
            TITLE="PDCA admit REJECTED on ${GITHUB_REF_NAME}"
            # title-dedup: one open issue per branch, no spam on repeated pushes
            if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" \
                --json number --jq '.[].number')" ]; then
              gh issue create --title "$TITLE" --body-file .pdca/admit_rejected.txt \
                --label pdca-admit || \
                gh issue create --title "$TITLE" --body-file .pdca/admit_rejected.txt
            fi
            exit 1
          fi

      - name: Upload ready
        if: startsWith(github.ref_name, 'pdca/')
        uses: actions/upload-artifact@v4
        with:
          name: ready
          path: .pdca/ready.json
          retention-days: 7

  check:
    runs-on: ubuntu-latest
    needs: admit   # job id `check` unchanged — branch protection context intact
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install pytest pytest-json-report ruff

      # Verdict cache (Phase 2, L4): judge verdicts are produced in THIS job,
      # which cannot commit (contents: read) — persist store/verdicts via
      # actions/cache instead. Decisions are produced in the act job and are
      # committed to the branch by its existing `git add -A` (§6.5 option a).
      # run_id in the key forces a save each run; restore-keys pull the latest.
      - name: Restore verdict cache
        if: startsWith(github.ref_name, 'pdca/')
        uses: actions/cache@v4
        with:
          path: store/verdicts
          key: verdicts-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            verdicts-${{ github.ref_name }}-
            verdicts-

      # Rubric gates (Phase 2, L3) — class A checks + class B judge, driven by
      # the committed ready.json. Writes .pdca/rubric_result.json; ci_report.py
      # merges it (single writer of ci_result.json). The LLM credential is
      # scoped to THIS STEP ONLY (2026-07-06 uchino approved; ci.yml executes
      # maker-authored code, so use a spend-capped dedicated key). Absent
      # credential = class B fails closed inside the runner, never a skip.
      - name: Rubric gates
        if: startsWith(github.ref_name, 'pdca/')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          if [ -f .pdca/ready.json ]; then
            DOMAIN=$(python -c "import json; print(json.load(open('.pdca/ready.json'))['rubric_domain'])")
            TARGET=$(python -c "import json; print(json.load(open('.pdca/ready.json'))['artifact_target'])")
            python checks/runner.py --rubric "rubric/${DOMAIN}.yaml" --artifact "$TARGET"
            echo "rubric runner exit=$?"
          else
            echo "no ready.json — rubric gates skipped (pre-Phase-2 branch)"
          fi

      # Run each gate; collect the ids of whatever is red into FAILING.
      # ci_report.py turns that into a STABLE failure signature input
      # (sorted check ids), never a hash of raw logs.
      - name: Deterministic gates
        id: gates
        run: |
          set +e
          mkdir -p .pdca
          FAILING=()

          # exit code を file に直接書く (bash array 経由 廃止・IFS bug 完全回避)
          # 2026-06-30 fizzbuzz/multiply で踏破: bash IFS subshell が 非空 array でも
          # "1001" garbage を生成・group 名引き渡し pattern を 廃止 → ci_report.py が
          # exit code file + pytest.json を直読みする

          ruff check . --output-format=concise > ruff.txt 2>&1
          echo $? > .pdca/ruff_exit.txt

          pytest -q --no-header -p no:cacheprovider \
            --json-report --json-report-file=.pdca/pytest.json > pytest.txt 2>&1
          echo $? > .pdca/pytest_exit.txt

          echo "DEBUG: ruff_exit=$(cat .pdca/ruff_exit.txt) pytest_exit=$(cat .pdca/pytest_exit.txt)"
          python .pdca/ci_report.py

      - name: Upload ci_result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_result
          path: .pdca/ci_result.json
          retention-days: 7
